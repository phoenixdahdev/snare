# snare's own CI. The `reusable` job below calls the same reusable workflow other
# repositories depend on, pinned to this pull request's own code (GitHub serves
# refs/pull/N/head on this repository for fork PRs too), so a PR is validated by
# its own code rather than by main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every script parses
        run: |
          for f in bin/snare lib/*.sh install.sh; do bash -n "$f" || exit 1; done
          echo "all scripts parse"

      # A two-minute shellcheck pass found a guard evasion hole that eight
      # rounds of manual review had missed. Keep it from coming back.
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null 2>&1
          shellcheck --version
          shellcheck -S warning bin/snare lib/*.sh install.sh

      # The shield snippet lives inside a heredoc, so neither `bash -n` nor
      # shellcheck ever parses it. A deleted if-body slipped through exactly
      # that gap. Validate the generated output itself.
      - name: Generated shield snippet is valid shell
        run: |
          chmod +x bin/snare
          ./bin/snare shield print > /tmp/snippet.sh
          bash -n /tmp/snippet.sh
          shellcheck -S warning -s bash /tmp/snippet.sh
          echo "snippet is valid"

      # The caller workflow ci.sh writes lives inside a heredoc too, so bash -n
      # and shellcheck never see it. Render it and prove both references name
      # one and the same full commit SHA — an unpinned `uses:` or a `snare-ref`
      # that can move is the defect this scaffolding exists to avoid.
      - name: Generated ci workflow pins the fork to one commit
        run: |
          chmod +x bin/snare
          SNARE_CI_PIN=0123456789abcdef0123456789abcdef01234567 ./bin/snare ci print > /tmp/caller.yml
          uses=$(grep -oE 'scan\.yml@[0-9a-f]{40}$' /tmp/caller.yml | cut -d@ -f2)
          ref=$(grep -oE 'snare-ref: [0-9a-f]{40}$' /tmp/caller.yml | awk '{print $2}')
          [ -n "$uses" ] || { echo "::error::uses is not pinned to a commit SHA"; exit 1; }
          [ -n "$ref" ] || { echo "::error::snare-ref is not pinned to a commit SHA"; exit 1; }
          [ "$uses" = "$ref" ] || { echo "::error::uses and snare-ref pin different commits"; exit 1; }
          echo "caller workflow pins the fork and the scanner to $uses"

      # help drifted: eight accepted subcommands were undocumented, including
      # `scan repo --new`, the only way to use the baseline feature help does
      # advertise. Fail the build if a dispatched command is missing from help.
      - name: Help documents every command
        run: |
          chmod +x bin/snare
          help_out="$(./bin/snare help 2>&1)"
          missing=0
          for c in guard scan fix notify doctor update selftest report schedule \
                   baseline hook shield ci rotate version help; do
            echo "$help_out" | grep -q "snare $c" || { echo "::error::'$c' is dispatched but absent from snare help"; missing=1; }
          done
          [ "$missing" = 0 ] && echo "help covers every top-level command"
          exit $missing

      # The site's release notes are generated from CHANGELOG.md, so a version
      # bump with no changelog entry would ship a page that silently omits the
      # release. Fail here rather than there.
      - name: Version has a changelog entry, and the site regenerates
        run: |
          v="$(grep -m1 '^SNARE_VERSION=' bin/snare | cut -d'"' -f2)"
          grep -q "^## \[$v\]" CHANGELOG.md \
            || { echo "::error::SNARE_VERSION is $v but CHANGELOG.md has no ## [$v] entry"; exit 1; }
          echo "changelog has an entry for $v"
          python3 docs/changelog-gen.py CHANGELOG.md > /tmp/rel.html
          grep -q "id=\"v$(echo "$v" | tr . -)\"" /tmp/rel.html \
            || { echo "::error::changelog-gen produced no section for $v"; exit 1; }
          echo "release notes render for $v"

      - name: Detection works (selftest)
        run: |
          chmod +x bin/snare
          ./bin/snare selftest

      # Scan snare with the code from this PR, from outside the tree so the
      # scanner is not scanning itself.
      - name: Scan this checkout
        run: |
          cp -r . "$RUNNER_TEMP/snare-tool"
          chmod +x "$RUNNER_TEMP/snare-tool/bin/snare"
          set +e
          "$RUNNER_TEMP/snare-tool/bin/snare" scan repo . | tee /tmp/scan.txt
          set -e
          n=$(grep -c '\[!\]' /tmp/scan.txt || true)
          if [ "${n:-0}" -ne 0 ]; then
            echo "::error::snare reported $n finding(s) against its own tree"
            exit 1
          fi
          echo "clean"

  # Prove the reusable workflow other people depend on still works end to end.
  # Exercise the reusable workflow other repositories depend on, pinned to the
  # code under review. github.head_ref names a branch that only exists on the
  # contributor's fork, so it cannot be fetched from here — but GitHub
  # publishes refs/pull/N/head on this repository for every pull request,
  # including forks, so use that.
  reusable:
    uses: ./.github/workflows/scan.yml
    with:
      snare-ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref_name }}
