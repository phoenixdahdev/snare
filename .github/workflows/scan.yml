# Reusable snare scan. Other repositories call it in four lines:
#
#   jobs:
#     snare:
#       uses: phoenixdahdev/snare/.github/workflows/scan.yml@<full-commit-sha>
#       with:
#         snare-ref: <full-commit-sha>
#
# Pin both to the same full commit SHA. This workflow runs scanner code inside
# the calling repository's job, next to whatever secrets that job holds, so
# neither the workflow definition nor the scanner revision may come from a
# branch or tag that can move — and neither may come from another account.
#
# Make it a required status check in branch protection and a pull request
# cannot be merged until it passes.
name: snare scan

on:
  workflow_call:
    inputs:
      full-history:
        description: "Scan every commit, not just the checked-out tip"
        type: boolean
        default: false
      # No default on purpose: a default is a revision the caller did not
      # choose, and this runs inside the caller's job. Name the exact commit.
      snare-ref:
        description: "Snare revision to run — a full commit SHA"
        type: string
        required: true
      fail-on-findings:
        description: "Fail the job when something is found"
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository being scanned
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.full-history && 0 || 1 }}

      # Cloned by hand rather than with actions/checkout, for two reasons.
      #
      # actions/checkout can only write inside the workspace, and a scanner
      # sitting inside the repository it is scanning gets scanned too — snare's
      # own docs quote every IOC verbatim. Cloning straight into RUNNER_TEMP
      # keeps it out of the tree with no move step.
      #
      # And the code that runs here comes from this fork, at the exact commit
      # the caller passed — never from another account and never from a moving
      # branch. A ref that cannot be fetched fails the job: falling back to a
      # branch would quietly run a different scanner than the caller pinned,
      # inside a job that also holds that repository's secrets.
      - name: Check out snare
        run: |
          set -euo pipefail
          ref='${{ inputs.snare-ref }}'
          if [ -z "$ref" ]; then
            echo "::error::snare-ref is empty — pass the full commit SHA to run"
            exit 1
          fi
          dest="$RUNNER_TEMP/snare"
          git init --quiet "$dest"
          git -C "$dest" remote add origin https://github.com/phoenixdahdev/snare.git
          if ! git -C "$dest" fetch --quiet --depth 1 origin "$ref"; then
            echo "::error::could not fetch snare ref '$ref' from phoenixdahdev/snare — refusing to run an unpinned scanner"
            exit 1
          fi
          echo "scanning with snare @ $ref"
          git -C "$dest" checkout --quiet FETCH_HEAD
          chmod +x "$dest/bin/snare"

      # A scanner whose detection is broken must never report a green tick.
      # Four false-clean defects shipped exactly that way, so this gate runs
      # before the scan and fails the job if detection is not working.
      - name: Verify the scanner itself works
        run: |
          "$RUNNER_TEMP/snare/bin/snare" selftest

      - name: Scan this repository
        id: scan
        run: |
          set +e
          "$RUNNER_TEMP/snare/bin/snare" scan repo . | tee /tmp/snare-scan.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          n=$(grep -c '\[!\]' /tmp/snare-scan.txt || true)
          echo "findings=$n" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          n="${{ steps.scan.outputs.findings }}"
          {
            echo "## snare scan"
            echo
            if [ "${n:-0}" -eq 0 ]; then
              echo "No findings. :white_check_mark:"
            else
              echo "**${n} finding(s).** :rotating_light:"
              echo
              echo '```'
              grep '\[!\]' /tmp/snare-scan.txt | head -40
              echo '```'
              echo
              echo "A payload can hide behind a long run of spaces on one line, so it"
              echo "looks normal in a diff. Read the flagged lines in full before merging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on findings
        if: ${{ inputs.fail-on-findings && steps.scan.outputs.findings != '0' }}
        run: |
          echo "::error::snare found ${{ steps.scan.outputs.findings }} issue(s) — refusing to pass."
          exit 1
